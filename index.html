<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blokzincir Tapu Kayıt ve Satış Sistemi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
</head>
<body>

    <header>
        <h1>DeFi<span>Tapu</span></h1>
        <button class="wallet-btn" id="connectWalletBtn" onclick="cuzdanBagla()">Metamask Bağla</button>
    </header>

    <main>
        <div class="info-box">
            <p id="cuzdanAdresi"><strong>Aktif Cüzdan:</strong> Lütfen MetaMask cüzdanınızı bağlayın.</p>
        </div>

        <div class="grid-container">
            <div class="sidebar">
                <div class="card">
                    <h2>Yeni Tapu Kaydı Ekle</h2>
                    <form id="tapuEkleForm" onsubmit="tapuKaydet(event)">
                        <div class="form-group">
                            <label for="tapuNo">Tapu Seri / Ada-Parsel No</label>
                            <input type="text" id="tapuNo" placeholder="Örn: 402/12" required>
                        </div>
                        <div class="form-group">
                            <label for="konum">Mülk Konumu (İl/İlçe/Açıklama)</label>
                            <input type="text" id="konum" placeholder="Örn: İstanbul, Beşiktaş" required>
                        </div>
                        <div class="form-group">
                            <label for="fiyat">Satış Fiyatı (ETH Cinsinden)</label>
                            <input type="number" id="fiyat" step="0.001" placeholder="Örn: 0.15" required>
                        </div>
                        <div class="form-group">
                            <label for="ilkSahibi">İlk Atanacak Sahip Adresi (Wallet Address)</label>
                            <input type="text" id="ilkSahibi" placeholder="0x..." required>
                        </div>
                        <button type="submit" class="submit-btn">Tapuyu Sisteme Kaydet</button>
                    </form>
                </div>

                <div class="card">
                    <h2>Tekil Tapu Sorgula</h2>
                    <div class="form-group">
                        <label for="sorguId">Mülk (Tapu) ID</label>
                        <input type="number" id="sorguId" placeholder="Örn: 1">
                    </div>
                    <button type="button" class="submit-btn" onclick="tekMulkSorgula()">Sorgula</button>
                </div>
            </div>

            <div class="content">
                <div class="card">
                    <h2>Sistemdeki Kayıtlı Mülkler</h2>
                    <div class="mulk-listesi" id="mulkListesiGosterge">
                        <p style="color: var(--text-light);">Henüz mülk yüklenmedi veya cüzdan bağlı değil.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- KOD ENTEGRASYON ALANI ---
        const contractAddress = "0xdb9af75f56ebe5dd0aaa834b876f6737f648a03b";
        const contractABI = [
            {
                "inputs": [],
                "stateMutability": "nonpayable",
                "type": "constructor"
            },
            {
                "anonymous": false,
                "inputs": [
                    {
                        "indexed": true,
                        "internalType": "uint256",
                        "name": "id",
                        "type": "uint256"
                    },
                    {
                        "indexed": false,
                        "internalType": "uint256",
                        "name": "yeniFiyat",
                        "type": "uint256"
                    },
                    {
                        "indexed": false,
                        "internalType": "bool",
                        "name": "satilikMi",
                        "type": "bool"
                    }
                ],
                "name": "DurumGuncellendi",
                "type": "event"
            },
            {
                "inputs": [
                    {
                        "internalType": "uint256",
                        "name": "_id",
                        "type": "uint256"
                    },
                    {
                        "internalType": "uint256",
                        "name": "_yeniFiyat",
                        "type": "uint256"
                    },
                    {
                        "internalType": "bool",
                        "name": "_satilikMi",
                        "type": "bool"
                    }
                ],
                "name": "mulkDurumuGuncelle",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "anonymous": false,
                "inputs": [
                    {
                        "indexed": true,
                        "internalType": "uint256",
                        "name": "id",
                        "type": "uint256"
                    },
                    {
                        "indexed": false,
                        "internalType": "string",
                        "name": "tapuNo",
                        "type": "string"
                    },
                    {
                        "indexed": false,
                        "internalType": "string",
                        "name": "konum",
                        "type": "string"
                    },
                    {
                        "indexed": false,
                        "internalType": "uint256",
                        "name": "fiyat",
                        "type": "uint256"
                    },
                    {
                        "indexed": true,
                        "internalType": "address",
                        "name": "mevcutSahibi",
                        "type": "address"
                    }
                ],
                "name": "MulkKaydedildi",
                "type": "event"
            },
            {
                "inputs": [
                    {
                        "internalType": "string",
                        "name": "_tapuNo",
                        "type": "string"
                    },
                    {
                        "internalType": "string",
                        "name": "_konum",
                        "type": "string"
                    },
                    {
                        "internalType": "uint256",
                        "name": "_fiyat",
                        "type": "uint256"
                    },
                    {
                        "internalType": "address payable",
                        "name": "_ilkSahibi",
                        "type": "address"
                    }
                ],
                "name": "mulkKaydet",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "anonymous": false,
                "inputs": [
                    {
                        "indexed": true,
                        "internalType": "uint256",
                        "name": "id",
                        "type": "uint256"
                    },
                    {
                        "indexed": true,
                        "internalType": "address",
                        "name": "eskiSahibi",
                        "type": "address"
                    },
                    {
                        "indexed": true,
                        "internalType": "address",
                        "name": "yeniSahibi",
                        "type": "address"
                    },
                    {
                        "indexed": false,
                        "internalType": "uint256",
                        "name": "fiyat",
                        "type": "uint256"
                    }
                ],
                "name": "MulkSatildi",
                "type": "event"
            },
            {
                "inputs": [
                    {
                        "internalType": "uint256",
                        "name": "_id",
                        "type": "uint256"
                    }
                ],
                "name": "mulkSatinAl",
                "outputs": [],
                "stateMutability": "payable",
                "type": "function"
            },
            {
                "inputs": [
                    {
                        "internalType": "uint256",
                        "name": "_id",
                        "type": "uint256"
                    }
                ],
                "name": "mulkDetayGetir",
                "outputs": [
                    {
                        "internalType": "string",
                        "name": "tapuNo",
                        "type": "string"
                    },
                    {
                        "internalType": "string",
                        "name": "konum",
                        "type": "string"
                    },
                    {
                        "internalType": "uint256",
                        "name": "fiyat",
                        "type": "uint256"
                    },
                    {
                        "internalType": "address",
                        "name": "mevcutSahibi",
                        "type": "address"
                    },
                    {
                        "internalType": "bool",
                        "name": "satilikMi",
                        "type": "bool"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "name": "mulkler",
                "outputs": [
                    {
                        "internalType": "uint256",
                        "name": "id",
                        "type": "uint256"
                    },
                    {
                        "internalType": "string",
                        "name": "tapuNo",
                        "type": "string"
                    },
                    {
                        "internalType": "string",
                        "name": "konum",
                        "type": "string"
                    },
                    {
                        "internalType": "uint256",
                        "name": "fiyat",
                        "type": "uint256"
                    },
                    {
                        "internalType": "address payable",
                        "name": "mevcutSahibi",
                        "type": "address"
                    },
                    {
                        "internalType": "bool",
                        "name": "satilikMi",
                        "type": "bool"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "mulkSayaci",
                "outputs": [
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "owner",
                "outputs": [
                    {
                        "internalType": "address",
                        "name": "",
                        "type": "address"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            }
        ];
        // -----------------------------------------------------------------

        let provider;
        let signer;
        let tapuKontrati;

        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await provider.listAccounts();
                if (accounts.length > 0) {
                    cuzdanBagla();
                }
            } else {
                alert("Lütfen web tarayıcınıza MetaMask eklentisini kurun!");
            }
        });

        async function cuzdanBagla() {
            try {
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                const userAddress = await signer.getAddress();
                
                document.getElementById("cuzdanAdresi").innerHTML = `<strong>Aktif Cüzdan:</strong> ${userAddress}`;
                document.getElementById("connectWalletBtn").innerText = "Bağlandı";
                document.getElementById("connectWalletBtn").style.backgroundColor = "var(--success-color)";

                // Adresi ethers'in en katı formatı ile normalize edip ENS hatasını engelliyoruz
                try {
                    const safeAddress = ethers.utils.getAddress(contractAddress.trim());
                    if (safeAddress && contractABI.length > 0) {
                        tapuKontrati = new ethers.Contract(safeAddress, contractABI, signer);
                        tumMulkleriListele();
                    }
                } catch (addrErr) {
                    alert("Kontrat adresi çözülemedi, lütfen contractAddress değişkenini kontrol edin.");
                }
            } catch (error) {
                console.error("Cüzdan bağlantısı başarısız:", error);
            }
        }

        async function tumMulkleriListele() {
            if (!tapuKontrati) return;

            const listeAlani = document.getElementById("mulkListesiGosterge");
            listeAlani.innerHTML = "<p>Veriler blokzincirden yükleniyor...</p>";

            try {
                const toplamMulk = await tapuKontrati.mulkSayaci();
                let dinamikHtml = "";

                if (toplamMulk.toNumber() === 0) {
                    listeAlani.innerHTML = "<p>Sistemde henüz kayıtlı mülk yok.</p>";
                    return;
                }

                for (let i = 1; i <= toplamMulk.toNumber(); i++) {
                    const mulk = await tapuKontrati.mulkler(i);
                    
                    const etherFiyat = ethers.utils.formatEther(mulk.fiyat);
                    const durumBadge = mulk.satilikMi 
                        ? `<span class="badge badge-satilik">Satılık</span>` 
                        : `<span class="badge badge-satildi">Satıldı / Pasif</span>`;

                    const satinAlButon = mulk.satilikMi 
                        ? `<button class="buy-btn" onclick="mulkSatinAl(${mulk.id})">Satın Al (Mülkiyeti Devral)</button>` 
                        : '';

                    dinamikHtml += `
                        <div class="mulk-kart">
                            <div class="mulk-header">
                                <h3>ID: #${mulk.id} - ${mulk.tapuNo}</h3>
                                ${durumBadge}
                            </div>
                            <div class="mulk-detay">
                                <p><strong>Konum:</strong> ${mulk.konum}</p>
                                <p><strong>Mevcut Sahibi:</strong> <small>${mulk.mevcutSahibi}</small></p>
                                <div class="mulk-fiyat">${etherFiyat} ETH</div>
                            </div>
                            ${satinAlButon}
                        </div>
                    `;
                }
                listeAlani.innerHTML = dinamikHtml;
            } catch (error) {
                console.error("Mülk listesi çekilemedi:", error);
                listeAlani.innerHTML = "<p>Veriler çekilirken bir hata oluştu.</p>";
            }
        }

        async function tapuKaydet(event) {
            event.preventDefault();
            if (!tapuKontrati) return alert("Önce cüzdanınızı bağlayın!");

            const tapuNo = document.getElementById("tapuNo").value;
            const konum = document.getElementById("konum").value;
            const fiyatEther = document.getElementById("fiyat").value;
            const ilkSahibiInput = document.getElementById("ilkSahibi").value.trim();

            try {
                // Formdaki input adresini de ENS hatası vermemesi için korumaya alıyoruz
                const safeİlkSahibi = ethers.utils.getAddress(ilkSahibiInput);
                const fiyatWei = ethers.utils.parseEther(fiyatEther);

                const tx = await tapuKontrati.mulkKaydet(tapuNo, konum, fiyatWei, safeİlkSahibi);
                alert("İşlem blokzincire gönderildi, onay bekleniyor... Tx: " + tx.hash);
                
                await tx.wait();
                alert("Tapu başarıyla blokzincire kaydedildi!");
                document.getElementById("tapuEkleForm").reset();
                tumMulkleriListele();
            } catch (error) {
                console.error("Tapu eklenirken hata:", error);
                alert("Hata oluştu! Lütfen girdiğiniz cüzdan adresinin (0x...) doğruluğundan emin olun.");
            }
        }

        async function mulkSatinAl(id) {
            if (!tapuKontrati) return alert("Önce cüzdanınızı bağlayın!");

            try {
                const mulk = await tapuKontrati.mulkler(id);
                const tx = await tapuKontrati.mulkSatinAl(id, { value: mulk.fiyat });

                alert("Satın alma talebi işleniyor... Tx: " + tx.hash);
                await tx.wait();
                
                alert("Tebrikler! Mülkiyet başarıyla blokzincir üzerinde üzerinize transfer edildi.");
                tumMulkleriListele();
            } catch (error) {
                console.error("Satın alma hatası:", error);
                alert("Satış işlemi gerçekleştirilemedi.");
            }
        }

        async function tekMulkSorgula() {
            if (!tapuKontrati) return alert("Önce cüzdanınızı bağlayın!");
            const id = document.getElementById("sorguId").value;
            if(!id) return alert("Lütfen bir ID girin.");

            try {
                const mulk = await tapuKontrati.mulkDetayGetir(id);
                alert(`Tapu No: ${mulk.tapuNo}\nKonum: ${mulk.konum}\nFiyat: ${ethers.utils.formatEther(mulk.fiyat)} ETH\nSahibi: ${mulk.mevcutSahibi}\nSatılık mı?: ${mulk.satilikMi ? "Evet" : "Hayır"}`);
            } catch (error) {
                alert("Mülk bulunamadı veya hata oluştu.");
            }
        }
    </script>
</body>
</html>
